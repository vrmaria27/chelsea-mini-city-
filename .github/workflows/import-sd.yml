# Fetches the focused side streets (whole map) OSM extracts (detail + buildings) and
# commits them to the branch that triggered the run. Does not touch the main map extract.
name: Import side streets (whole map) OSM detail
on:
  workflow_dispatch:
  push:
    branches: [osm-sd]
    paths: [scripts/osm/fetch-square.mjs, .github/workflows/import-sd.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch (with retries)
        run: |
          for i in 1 2 3 4; do node scripts/osm/fetch-square.mjs --area all --buildings --out data/osm/sd-buildings.json && break; echo "retry in 60s"; sleep 60; done
          for i in 1 2 3 4; do node scripts/osm/fetch-square.mjs --area all --out data/osm/sd-raw.json && exit 0; echo "retry in 60s"; sleep 60; done; exit 1
      - name: Commit extract
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm/sd-*.json || true
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Import side streets (whole map) OSM detail ($(date -u +%Y-%m-%d)) — © OpenStreetMap contributors, ODbL"
          git push
