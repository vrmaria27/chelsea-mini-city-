<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Chelsea Explorer</title>
  <meta name="description" content="Explore a reconstructed model of Sloane Square and King's Road, Chelsea, as a tabletop miniature and at street level, on Meta Quest 3 (WebXR) or desktop." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 30V14l8-6 8 6v16z' fill='%23a9563f'/%3E%3Cpath d='M18 30V18l5-4 5 4v12z' fill='%23f0e7d4'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #e9e3d8; --card: rgba(250, 246, 238, 0.93); --ink: #2e2a26; --soft: #6f655a; --line: #e0d4bf;
      --green: #2f5a45; --bad: #a33b32; --gold: #c99a4a;
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }
    canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .hud { position: fixed; z-index: 2; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 4px 18px rgba(60, 45, 30, 0.1); }
    button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 7px 11px; font-size: 13.5px; }
    button:hover { background: #f3e3c3; }
    button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    button.primary { background: var(--green); color: #fff; border-color: var(--green); font-weight: 700; }
    button.primary:hover { background: #24483a; }
    button[aria-pressed="true"] { background: #dfe9e3; border-color: #9fbcab; }
    button.link { border: 0; background: none; padding: 0; color: var(--green); text-decoration: underline; font-size: inherit; }
    #top { top: 12px; left: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: calc(100vw - 24px); }
    #top h1 { font-size: 17px; margin: 0 6px 0 2px; letter-spacing: 0.2px; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .seg button { border: 0; border-radius: 0; }
    .seg button[aria-pressed="true"] { background: var(--green); color: #fff; }
    #compass { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; }
    #compass svg { transition: none; }
    #places { top: 70px; left: 12px; width: 250px; padding: 10px; max-height: calc(100vh - 170px); overflow: auto; }
    #places h2, #side h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--soft); margin: 2px 4px 6px; }
    #places ul { list-style: none; margin: 0; padding: 0; }
    #places li button { width: 100%; text-align: left; border: 0; padding: 6px 8px; border-radius: 8px; background: transparent; }
    #places li button:hover { background: #f3e3c3; }
    #places li button[aria-current="true"] { background: #dfe9e3; font-weight: 700; }
    #places li small { display: block; color: var(--soft); font-size: 11px; }
    #side { top: 70px; right: 12px; width: 220px; padding: 10px; display: grid; gap: 6px; }
    #side .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    #info { bottom: 14px; left: 50%; transform: translateX(-50%); width: min(620px, calc(100vw - 24px)); padding: 12px 16px; font-size: 14px; line-height: 1.45; }
    #info h3 { margin: 0 0 2px; font-size: 16px; }
    #info p { margin: 0; }
    #info .notice.warn { color: var(--bad); font-weight: 600; }
    #info .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    #info .help { color: var(--soft); font-size: 12.5px; }
    #vr { position: fixed; z-index: 3; right: 12px; bottom: 14px; padding: 10px 12px; max-width: 260px; font-size: 12.5px; }
    #vr button { width: 100%; font-size: 15px; padding: 9px; }
    #vr p { margin: 0; color: var(--soft); }
    #fade { position: fixed; inset: 0; z-index: 1; background: #1d1a17; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
    #attribution { position: fixed; z-index: 2; left: 12px; bottom: 6px; font-size: 11px; color: var(--soft); }
    #attribution a { color: var(--green); }
    .modal { position: fixed; z-index: 5; inset: 0; display: grid; place-items: center; background: rgba(40, 32, 24, 0.3); }
    .modal .card { width: min(580px, 92vw); max-height: 86vh; overflow: auto; padding: 20px 24px; font-size: 14px; line-height: 1.5; }
    .modal h2 { margin: 0 0 10px; }
    .modal .sub { color: var(--soft); }
    #error { position: fixed; inset: 0; display: none; place-items: center; z-index: 9; background: var(--bg); padding: 24px; text-align: center; }
    body.street #places { opacity: 0.96; }
    @media (max-width: 820px) {
      #places { top: auto; bottom: 150px; width: 200px; max-height: 34vh; }
      #side { top: auto; bottom: 150px; width: 170px; }
      #vr, #attribution { display: none; }
      #info { bottom: 8px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="3D model of Sloane Square and King's Road, Chelsea"></canvas>
  <div id="fade"></div>

  <header id="top" class="hud card">
    <h1>Chelsea Explorer</h1>
    <div class="seg" role="group" aria-label="View">
      <button data-action="toMiniature" id="btnMini" aria-pressed="true">Miniature</button>
      <button data-action="toStreet" id="btnStreet" aria-pressed="false">Street level</button>
    </div>
    <div id="compass" title="North indicator" aria-label="North indicator"><svg width="26" height="26" viewBox="-13 -13 26 26" aria-hidden="true"><path d="M0 -11 L4 1 L0 -1 L-4 1 Z" fill="#a33b32"/><path d="M0 11 L4 -1 L0 1 L-4 -1 Z" fill="#b9b0a3"/></svg></div>
    <span style="font-size:12px;color:var(--soft)">North</span>
  </header>

  <nav id="places" class="hud card" aria-label="Places">
    <h2>Places</h2>
    <ul id="placeList"></ul>
  </nav>

  <aside id="side" class="hud card" aria-label="View and settings">
    <h2 id="sideTitle">Miniature</h2>
    <div id="miniControls" class="row">
      <button data-action="rotL" title="Rotate the model (Q)">⟲ Rotate</button>
      <button data-action="rotR" title="Rotate the model (E)">Rotate ⟳</button>
      <button data-action="scaleDown" title="Smaller (−)">− Smaller</button>
      <button data-action="scaleUp" title="Larger (+)">Larger +</button>
      <button data-action="resetView" title="Reset the view (R)" style="grid-column: span 2">Reset view</button>
    </div>
    <div id="streetControls" hidden>
      <button data-action="toMiniature" class="primary" style="width:100%">Back to miniature</button>
      <div class="row" style="margin-top:6px">
        <button data-action="turnL" title="Turn left (Q)">↶ Turn</button>
        <button data-action="turnR" title="Turn right (E)">Turn ↷</button>
      </div>
      <button id="lockBtn" style="width:100%;margin-top:6px">Look with the mouse</button>
      <p class="sub" style="font-size:11.5px;margin:4px 2px 0;color:var(--soft)">Captures the pointer so moving the mouse looks around. Press <b>Esc</b> to release it.</p>
    </div>
    <h2 style="margin-top:6px">Settings</h2>
    <button data-action="labels" id="optLabels" aria-pressed="true">Labels: on</button>
    <button data-action="lowDetail" id="optDetail" aria-pressed="false">Low detail: off</button>
    <button data-action="reducedMotion" id="optMotion" aria-pressed="false">Reduced motion: off</button>
    <button data-action="about">About &amp; attribution</button>
  </aside>

  <section id="info" class="hud card" aria-live="polite"></section>

  <div id="vr" class="card"></div>
  <div id="attribution"></div>

  <div id="about" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
    <div class="card">
      <h2 id="aboutTitle">About Chelsea Explorer</h2>
      <div id="aboutBody"></div>
      <p><button id="aboutClose" class="primary">Close</button></p>
    </div>
  </div>

  <div id="error"></div>
  <script src="./main.js"></script>
</body>
</html>
